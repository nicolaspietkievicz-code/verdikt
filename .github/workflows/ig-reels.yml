# Tres reels por dia, repartidos.
#
# Vive aparte de ig-daily.yml a proposito. El diario ya carga con la logica del
# carrusel, la placa y sus marcadores; sumarle tres corridas con tres guardias
# lo volvia inmanejable. Aca los reels tienen su propia cadencia y su propio
# estado, y si algo se rompe se rompe solo esto.
#
# UNA TANDA, UN MARCADOR. Cada horario del dia lleva su archivo
# ig/media/last_reel_t<N>.txt con la fecha argentina de la ultima vez que esa
# tanda publico. Sin eso, los reintentos de una tanda pisarian a las otras: un
# unico marcador diario haria que la primera corrida bloquee a las dos que
# siguen.
#
# LOS MP4 NO SE COMMITEAN: se suben como adjuntos del release "media". Cada uno
# pesa ~3 MB y a tres por dia serian 3 GB al ano de historial de git que no se
# puede podar. Un adjunto se borra de verdad.
name: Reels de Verdikt

on:
  schedule:
    # Los horarios estan puestos TEMPRANO a proposito: GitHub atrasa los crons
    # de forma sistematica (medido en este repo: entre 54 min y 3 h 36). Se
    # pide a las 11, 16 y 20 ART para que, incluso atrasados, caigan repartidos
    # en el dia y no de madrugada.
    - cron: "0 14 * * *" # 11:00 ART
    - cron: "0 19 * * *" # 16:00 ART
    - cron: "0 23 * * *" # 20:00 ART
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin publicar (dry-run)"
        type: boolean
        default: true

permissions:
  contents: write # subir el adjunto al release y commitear la rotacion

# Los tres horarios comparten la rotacion y su marcador: si dos corrieran a la
# vez, publicarian el mismo activo.
concurrency:
  group: ig-reels
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      tanda: ${{ steps.g.outputs.tanda }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          DIA=$(date -u -d '-3 hours' +%F) # dia en hora argentina
          case "${{ github.event.schedule }}" in
            "0 14 * * *") TANDA=1 ;;
            "0 19 * * *") TANDA=2 ;;
            "0 23 * * *") TANDA=3 ;;
            *)            TANDA=0 ;; # disparo a mano
          esac
          echo "tanda=$TANDA" >> "$GITHUB_OUTPUT"
          echo "Dia ART: $DIA · tanda: $TANDA"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(cat ig/media/last_reel_t$TANDA.txt 2>/dev/null)" = "$DIA" ]; then
            echo "::notice::La tanda $TANDA del $DIA ya salio."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

  reel:
    needs: guard
    if: needs.guard.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # imageio-ffmpeg trae un ffmpeg con H.264 empaquetado: la imagen de
      # ubuntu-latest ya no incluye ffmpeg y el encode moria despues de
      # renderizar los 600 frames.
      - name: Instalar Pillow y ffmpeg
        run: pip install pillow imageio-ffmpeg

      - name: Instalar Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium

      - name: Cache de la voz
        uses: actions/cache@v4
        with:
          path: ig/reel/voces
          key: piper-es_ES-sharvard-medium-v1

      - name: Instalar la voz
        run: |
          pip install piper-tts
          if [ ! -f ig/reel/voces/es_ES-sharvard-medium.onnx ]; then
            python -m piper.download_voices --download-dir ig/reel/voces es_ES-sharvard-medium
          else
            echo "la voz ya estaba en cache"
          fi

      - name: ¿Hay credenciales?
        id: cfg
        run: echo "ready=${{ secrets.IG_ACCESS_TOKEN != '' && secrets.IG_USER_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: ¿Dry-run o de verdad?
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      - name: Elegir el activo
        id: asset
        run: |
          python ig_daily.py reel
          echo "asset=$(cat ig/media/reel_asset.txt)" >> "$GITHUB_OUTPUT"

      # continue-on-error: si el render falla, la rotacion no avanza y la
      # proxima tanda reintenta este mismo activo.
      - name: Renderizar el reel
        id: render
        continue-on-error: true
        run: |
          ASSET="${{ steps.asset.outputs.asset }}"
          python make-ig-reel.py "${ASSET#*:}" "${ASSET%%:*}"

      - name: Subir al release
        id: subir
        if: steps.render.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO=$(cat ig/media/reel_video.txt)
          gh release upload media "$VIDEO" --clobber --repo "${{ github.repository }}"
          echo "url=https://github.com/${{ github.repository }}/releases/download/media/$(basename "$VIDEO")" >> "$GITHUB_OUTPUT"

      - name: Publicar
        id: pub
        if: steps.render.outcome == 'success' && steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          URL="${{ steps.subir.outputs.url }}"
          echo "Video: $URL"
          curl -sIL "$URL" | grep -iE "^HTTP|^content-length" | head -4
          python ig_daily.py publish-reel --video-url "$URL" ${{ steps.mode.outputs.dry }}

      # La rotacion y el marcador de la tanda avanzan SOLO si Instagram
      # confirmo: si fallo, la proxima corrida reintenta el mismo activo.
      - name: Anotar lo publicado
        if: steps.pub.outcome == 'success' && steps.mode.outputs.dry == ''
        run: |
          git config user.name "verdikt-bot"
          git config user.email "bot@verdikt.finance"
          date -u -d '-3 hours' +%F > ig/media/last_reel_t${{ needs.guard.outputs.tanda }}.txt
          git add ig/media/last_reel.txt ig/media/last_reel_t${{ needs.guard.outputs.tanda }}.txt ig/reels
          git commit -m "IG: reel tanda ${{ needs.guard.outputs.tanda }} ($(cat ig/media/last_reel.txt))" || echo "sin cambios"
          git pull --rebase --autostash
          git push

      - name: Podar reels viejos del release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIEJOS=$(gh release view media --repo "${{ github.repository }}" \
                     --json assets --jq '.assets | sort_by(.createdAt) | .[:-6] | .[].name')
          for a in $VIEJOS; do
            echo "borrando $a"
            gh release delete-asset media "$a" --yes --repo "${{ github.repository }}"
          done
          [ -z "$VIEJOS" ] && echo "nada que podar"
