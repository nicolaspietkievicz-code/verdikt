# Posteo diario del Instagram de Verdikt, 100% automatico.
#
# Publica dos cosas, con criterios distintos:
#
#   cambios de veredicto -> SOLO si hoy hubo. Se genera con datos vivos, se
#     commitea/pushea a este repo (para que tenga URL publica) y se publica por
#     la Graph API oficial. Sin cambios, no sale nada (no spamea un post vacio).
#
#   placa evergreen -> TODOS los dias, haya cambios o no: es lo que le da ritmo
#     a la cuenta. Su PNG ya vive commiteado en ig/placas/, asi que aca solo se
#     elige cual toca en la rotacion y se publica. Los dias con cambios salen
#     los dos posteos.
#
#   reel -> solo a pedido, pasando la ruta del MP4 al disparar el workflow. No
#     tiene schedule porque el render corre local y se revisa a mano antes de
#     subirlo. Cuando se pide un reel NO sale la placa: es un posteo puntual, no
#     un dia mas de la rotacion. (Vive aca y no en un workflow propio porque
#     workflow_dispatch solo existe si el archivo esta en la rama default: uno
#     nuevo no se podria disparar hasta mergearlo, ni probar antes.)
#
# Para que PUBLIQUE hacen falta dos secrets del repo (Settings -> Secrets and
# variables -> Actions): IG_USER_ID e IG_ACCESS_TOKEN. Sin ellos genera y
# commitea la imagen pero saltea el publish (ver SETUP-IG.md).
name: Instagram diario de Verdikt

on:
  schedule:
    - cron: "20 22 * * *" # 22:20 UTC = 19:20 ART, despues del snapshot (21:10) y sus cambios
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin publicar (dry-run)"
        type: boolean
        default: true
      reel:
        description: "Ruta de un MP4 del repo para publicar como reel (vacio = no publica reel)"
        required: false
        default: ""

permissions:
  contents: write # para pushear la imagen generada

concurrency:
  group: ig-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Generar el posteo del dia
        run: python ig_daily.py generate

      # La placa evergreen sale TODOS los dias, haya o no cambios de veredicto:
      # es lo que le da ritmo a la cuenta. Las 40 ya estan dibujadas en
      # ig/placas/, aca solo se elige cual toca segun la rotacion.
      #
      # Corre incluso si el paso anterior fallo (backend caido, por ejemplo):
      # elegir una placa no depende de datos del dia, y justo un dia sin datos
      # es cuando mas hace falta que la cuenta postee algo.
      - name: Elegir la placa del dia
        if: ${{ !cancelled() && inputs.reel == '' }}
        run: python ig_daily.py placa

      # Estos tres son solo lecturas de estado, sin efecto sobre Instagram: van
      # con !cancelled() para que un fallo al generar los cambios no se lleve
      # puesto el camino de la placa, que depende de sus salidas.
      - name: ¿Hay algo para publicar?
        id: check
        if: ${{ !cancelled() }}
        run: |
          if [ -f ig/media/latest_image.txt ]; then
            echo "post=yes" >> "$GITHUB_OUTPUT"
            echo "image=$(cat ig/media/latest_image.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "post=no" >> "$GITHUB_OUTPUT"
            echo "Sin cambios de veredicto hoy: no se publica."
          fi

      - name: ¿Estan los secrets de Instagram?
        id: cfg
        if: ${{ !cancelled() }}
        run: echo "ready=${{ secrets.IG_ACCESS_TOKEN != '' && secrets.IG_USER_ID != '' }}" >> "$GITHUB_OUTPUT"

      # Se decide una sola vez y lo usan los dos publish: si cada uno repitiera
      # la condicion, alcanzaria con tocar una para publicar de verdad sin querer.
      - name: ¿Dry-run o de verdad?
        id: mode
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitear la imagen (le da URL publica)
        if: steps.check.outputs.post == 'yes'
        run: |
          git config user.name "verdikt-bot"
          git config user.email "bot@verdikt.finance"
          git add ig/media
          git commit -m "IG: cambios de veredicto ($(date -u +%F))" || echo "nada que commitear"
          git push

      - name: Publicar en Instagram
        if: steps.check.outputs.post == 'yes' && steps.cfg.outputs.ready == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${{ github.repository }}/$SHA/${{ steps.check.outputs.image }}"
          echo "Imagen publica: $URL"
          sleep 10 # darle al CDN de GitHub un momento para servir esa SHA
          python ig_daily.py publish --image-url "$URL" ${{ steps.mode.outputs.dry }}

      # El marcador de "ultima fecha publicada" solo sirve si sobrevive a la
      # corrida: sin este commit, manana el repo no sabria que ya se posteo.
      - name: Commitear el marcador de publicado
        if: steps.check.outputs.post == 'yes' && steps.cfg.outputs.ready == 'true'
        run: |
          if [ -f ig/media/last_published.txt ]; then
            git add ig/media/last_published.txt
            git commit -m "IG: marca publicado ($(cat ig/media/last_published.txt))" || echo "sin cambios"
            git push
          fi

      # Va DESPUES de los cambios y sin depender de ellos: la placa es el posteo
      # de base. Su PNG ya esta en el repo desde hace commits, asi que no hay
      # nada que pushear ni que esperar al CDN antes de publicarla.
      - name: Publicar la placa del dia
        if: ${{ !cancelled() && inputs.reel == '' && steps.cfg.outputs.ready == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ ! -f ig/media/placa_image.txt ]; then
            echo "Sin placa para hoy: no se publica."
            exit 0
          fi
          IMG=$(cat ig/media/placa_image.txt)
          URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/$IMG"
          echo "Placa publica: $URL"
          python ig_daily.py publish-placa --image-url "$URL" ${{ steps.mode.outputs.dry }}

      # Igual que el marcador de los cambios: sin este commit la rotacion no
      # avanza y manana volveria a tocar la misma placa.
      - name: Commitear la rotacion de la placa
        if: ${{ !cancelled() && inputs.reel == '' && steps.cfg.outputs.ready == 'true' }}
        run: |
          if [ -f ig/media/last_placa.txt ]; then
            git config user.name "verdikt-bot"
            git config user.email "bot@verdikt.finance"
            git add ig/media/last_placa.txt
            git commit -m "IG: placa publicada ($(cat ig/media/last_placa.txt))" || echo "sin cambios"
            git push
          fi

      # El MP4 tiene que estar COMMITEADO: Instagram no recibe bytes, baja el
      # video de una URL publica https. Se chequea que el archivo y su caption
      # existan ANTES de hablar con la Graph API, porque un 404 deja el
      # contenedor en ERROR con un mensaje que no explica nada.
      - name: Publicar el reel indicado
        if: ${{ !cancelled() && inputs.reel != '' && steps.cfg.outputs.ready == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          VIDEO="${{ inputs.reel }}"
          CAP="${VIDEO%.mp4}.txt"
          test -f "$VIDEO" || { echo "::error::No existe $VIDEO en el repo"; exit 1; }
          test -f "$CAP"   || { echo "::error::No existe el caption $CAP"; exit 1; }
          URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/$VIDEO"
          echo "Video publico: $URL"
          curl -sI "$URL" | head -3   # si el CDN todavia no lo sirve, se ve aca
          python ig_publish.py --video-url "$URL" --caption-file "$CAP" ${{ steps.mode.outputs.dry }}

      - name: Aviso si falta configurar
        if: steps.cfg.outputs.ready != 'true'
        run: echo "::notice::Las imagenes se generaron, pero faltan los secrets IG_USER_ID / IG_ACCESS_TOKEN para publicar. Ver SETUP-IG.md."
