# LA IMAGEN DEL DIA del Instagram de Verdikt. Una por dia, siempre.
#
# Desde 09/2026 es una PLACA DE INFO diseñada (HTML + Playwright), no el
# carrusel Pillow de antes. `make-ig-placa.py hoy` elige que placa toca:
#   viernes -> termometro del mercado
#   domingo -> educativa
#   entre semana -> "cambio de opinion" si hubo cambios de veredicto, si no el
#                   "veredicto del dia" (el nº1 del ranking)
#
# Reels -> ig-reels.yml / ig-pendiente.yml. Historias -> ig-historia.yml.
#
# Para publicar hacen falta los secrets IG_USER_ID e IG_ACCESS_TOKEN (ver
# SETUP-IG.md). Sin ellos genera y commitea la placa pero no publica.
name: Instagram diario de Verdikt

on:
  schedule:
    # Tres intentos por noche, no tres posteos: GitHub atrasa y a veces saltea
    # los crons. El primero que llega postea y marca el dia; los otros ven el
    # marcador en "guard" y no hacen nada.
    - cron: "20 22 * * *" # 19:20 ART, despues del snapshot (21:10 UTC) y sus cambios
    - cron: "35 23 * * *" # 20:35 ART, reintento
    - cron: "50 0 * * *" #  21:50 ART, ultimo intento
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin publicar (dry-run)"
        type: boolean
        default: true
      tipo:
        description: "Forzar tipo: hoy | veredicto | termometro | cambios | educativa"
        default: "hoy"

permissions:
  contents: write

concurrency:
  group: ig-daily
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          DIA=$(date -u -d '-3 hours' +%F)
          echo "Dia ART: $DIA"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(cat ig/media/last_day.txt 2>/dev/null)" = "$DIA" ]; then
            echo "::notice::El posteo del $DIA ya salio."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

  post:
    needs: guard
    if: needs.guard.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium

      - name: Generar la placa del dia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python make-ig-placa.py ${{ inputs.tipo || 'hoy' }}

      - name: Commitear la placa (le da URL publica)
        run: |
          git config user.name "verdikt-bot"
          git config user.email "bot@verdikt.finance"
          git add ig/media/placa_hoy.png ig/media/last_educativa.txt
          git commit -m "IG: placa del dia ($(cat ig/media/placa_render.txt 2>/dev/null || echo hoy))" || echo "sin cambios"
          git pull --rebase --autostash
          git push

      - name: ¿Estan los secrets de Instagram?
        id: cfg
        run: echo "ready=${{ secrets.IG_ACCESS_TOKEN != '' && secrets.IG_USER_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: ¿Dry-run o de verdad?
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar en Instagram
        if: steps.cfg.outputs.ready == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/ig/media/placa_hoy.png"
          echo "Placa: $URL"
          curl -sIL "$URL" | grep -iE "^HTTP|^content-length" | head -4
          sleep 10 # que el CDN de GitHub sirva esa SHA
          python ig_publish.py --image-url "$URL" --caption-file ig/media/placa_hoy.txt ${{ steps.mode.outputs.dry }}

      - name: Marcar el dia como publicado
        if: steps.cfg.outputs.ready == 'true' && steps.mode.outputs.dry == ''
        run: |
          git config user.name "verdikt-bot"
          git config user.email "bot@verdikt.finance"
          date -u -d '-3 hours' +%F > ig/media/last_day.txt
          git add ig/media/last_day.txt
          git commit -m "IG: placa publicada ($(date -u -d '-3 hours' +%F))" || echo "sin cambios"
          git pull --rebase --autostash
          git push

      - name: Aviso si falta configurar
        if: steps.cfg.outputs.ready != 'true'
        run: echo "::notice::Placa generada, pero faltan los secrets IG_USER_ID / IG_ACCESS_TOKEN para publicar."
