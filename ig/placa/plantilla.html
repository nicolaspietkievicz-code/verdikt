<!doctype html>
<meta charset="utf-8">
<title>Verdikt · placa</title>
<style>
  @font-face { font-family: 'Playfair'; src: url('../fonts/PlayfairDisplay.ttf'); font-weight: 400 900; }
  @font-face { font-family: 'InterV'; src: url('../fonts/Inter-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'InterV'; src: url('../fonts/Inter-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'CascadiaV'; src: url('../fonts/CascadiaCode-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'CascadiaV'; src: url('../fonts/CascadiaCode-Regular.ttf'); font-weight: 400; }

  :root {
    --bg: #071019; --band: #0D1722; --border: #1E3342;
    --text: #E9EFF3; --dim: #8DA1AE; --faint: #536571;
    --green: #22C55E;
    --buy: #22C55E; --acc: #5FD693; --neu: #E0B341; --cau: #E8905A; --avo: #F2607A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'InterV', system-ui, sans-serif; }

  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; }

  #fondo { position: absolute; inset: 0; background-size: cover; background-position: center;
    filter: brightness(1.5) contrast(1.05) saturate(1.1); }
  #oscurece { position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(7,16,25,.5) 0%, rgba(7,16,25,.28) 45%, rgba(7,16,25,.8) 100%),
      linear-gradient(90deg, rgba(7,16,25,.95) 0%, rgba(7,16,25,.62) 46%, rgba(7,16,25,.22) 100%); }
  #grilla { position: absolute; inset: 0; opacity: .5;
    background-image:
      repeating-linear-gradient(0deg, #16232E 0 1px, transparent 1px 60px),
      repeating-linear-gradient(90deg, #16232E 0 1px, transparent 1px 60px); }
  #halo { position: absolute; right: -180px; top: 120px; width: 900px; height: 900px;
    background: radial-gradient(closest-side, rgba(34,197,94,.20), transparent 70%); }
  /* educativa: sin foto, el fondo es solo la grilla + halo centrado */
  body.educativa #fondo, body.educativa #oscurece { display: none; }
  body.educativa #halo { right: 50%; transform: translateX(50%); top: 260px; opacity: .8; }

  #cont { position: absolute; inset: 0; padding: 62px 66px 54px;
    display: flex; flex-direction: column; }

  .topbar { display: flex; justify-content: space-between; align-items: center;
    font-family: 'CascadiaV', monospace; font-size: 17px; letter-spacing: 2.5px;
    color: var(--dim); text-transform: uppercase;
    border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .topbar .fecha { color: var(--green); }

  .masthead { margin-top: 24px; }
  .masthead h1, .activo, .titular, .edu-q, .num {
    font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1, "onum" 0; }
  .masthead h1 { font-family: 'Playfair', serif; font-weight: 900;
    font-size: 124px; line-height: .92; letter-spacing: -1px; }
  .masthead h1 .g { color: var(--green); }
  .masthead .tagline { font-family: 'CascadiaV', monospace; font-size: 18px;
    letter-spacing: 4px; color: var(--dim); text-transform: uppercase; margin-top: 12px; }

  #cuerpo { flex: 1; margin-top: 36px; }
  body.educativa #cuerpo { display: flex; flex-direction: column; justify-content: center;
    margin-top: 0; padding-bottom: 40px; }
  body.educativa .edu-q { font-size: 82px; }
  body.educativa .edu-list li { font-size: 30px; margin-bottom: 28px; }
  body.educativa .edu-body { font-size: 34px; }

  .kicker { font-family: 'CascadiaV', monospace; font-size: 19px; letter-spacing: 4px;
    color: var(--green); text-transform: uppercase; }
  .kicker::before { content: ""; display: inline-block; width: 44px; height: 2px;
    background: var(--green); vertical-align: middle; margin-right: 14px; }

  /* ---- columnas texto / teléfono ---- */
  .cols { display: grid; grid-template-columns: 600px 1fr; gap: 30px; height: 100%; }
  .izq { min-width: 0; }

  .activo { font-family: 'Playfair', serif; font-weight: 800; font-size: 74px;
    line-height: 1.02; margin-top: 18px; }
  .ticker { font-family: 'CascadiaV', monospace; font-size: 21px; letter-spacing: 1px;
    color: var(--dim); margin-top: 10px; }

  .veredicto-row { display: flex; align-items: center; gap: 26px; margin-top: 28px; }
  .score { font-weight: 700; font-size: 104px; line-height: 1; letter-spacing: -3px;
    font-variant-numeric: lining-nums; }
  .score small { font-family: 'CascadiaV', monospace; font-weight: 400;
    font-size: 26px; color: var(--faint); letter-spacing: 0; }
  .pill { font-family: 'CascadiaV', monospace; font-weight: 700; font-size: 25px;
    letter-spacing: 2px; padding: 12px 22px; border: 2px solid currentColor; border-radius: 8px; }

  .titular { font-family: 'Playfair', serif; font-style: italic; font-weight: 500;
    font-size: 32px; line-height: 1.34; margin-top: 28px;
    border-left: 3px solid var(--green); padding-left: 22px; }

  .porque { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 34px; }
  .porque h3 { font-family: 'CascadiaV', monospace; font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px; }
  .porque li { list-style: none; font-size: 21px; line-height: 1.28;
    padding-left: 20px; position: relative; margin-bottom: 12px; }
  .porque li::before { content: ""; position: absolute; left: 0; top: 10px;
    width: 8px; height: 8px; border-radius: 2px; }
  .porque .fav li::before { background: var(--green); }
  .porque .con li::before { background: var(--avo); }

  /* ---- teléfono ---- */
  .telewrap { position: relative; display: flex; align-items: center; justify-content: center; }
  .phone { width: 340px; height: 720px; border-radius: 46px;
    background: #05090d; border: 3px solid #223140;
    box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 2px rgba(34,197,94,.08);
    transform: rotate(3.5deg); overflow: hidden; position: relative; }
  .phone .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 116px; height: 26px; background: #05090d; border-radius: 14px; z-index: 2; }
  .phone .screen { position: absolute; inset: 8px; border-radius: 40px; overflow: hidden; background: #071019; }
  .phone .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .phone .noscreen { position: absolute; inset: 8px; border-radius: 40px; background: #0D1722;
    display: flex; align-items: center; justify-content: center; color: var(--faint);
    font-family: 'CascadiaV', monospace; font-size: 15px; }

  /* ---- termómetro ---- */
  .mood-label { font-family: 'Playfair', serif; font-weight: 800; font-size: 66px;
    line-height: 1.05; margin-top: 20px; }
  .mood-bar { height: 26px; border-radius: 6px; overflow: hidden; display: flex;
    margin-top: 24px; border: 1px solid var(--border); }
  .mood-bar .bull { background: var(--green); }
  .mood-bar .bear { background: var(--avo); }
  .mood-bar .flat { background: #26333f; }
  .mood-legend { display: flex; justify-content: space-between; font-family: 'CascadiaV', monospace;
    font-size: 16px; color: var(--dim); margin-top: 10px; }
  .stats { margin-top: 34px; }
  .stats .row { display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 0; border-bottom: 1px solid var(--border); }
  .stats .row .k { font-family: 'CascadiaV', monospace; font-size: 19px; letter-spacing: 1px;
    color: var(--dim); text-transform: uppercase; }
  .stats .row .v { font-family: 'CascadiaV', monospace; font-weight: 700; font-size: 26px; }
  .stats .row .d { font-family: 'CascadiaV', monospace; font-size: 19px; margin-left: 12px; }
  .up { color: var(--green); } .down { color: var(--avo); }

  /* ---- cambios ---- */
  .changes { margin-top: 26px; }
  .changes .ch { display: grid; grid-template-columns: 150px 1fr auto; align-items: center;
    gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); }
  .changes .sym { font-family: 'CascadiaV', monospace; font-weight: 700; font-size: 26px; }
  .changes .flow { font-family: 'CascadiaV', monospace; font-size: 21px; letter-spacing: 1px; }
  .changes .flow .arr { color: var(--faint); margin: 0 10px; }
  .changes .sc { font-family: 'CascadiaV', monospace; font-size: 20px; color: var(--dim); }

  /* ---- educativa ---- */
  .edu { max-width: 900px; }
  .edu-q { font-family: 'Playfair', serif; font-weight: 800; font-size: 74px; line-height: 1.08;
    margin-top: 24px; }
  .edu-q .g { color: var(--green); }
  .edu-body { font-size: 30px; line-height: 1.5; color: var(--text); margin-top: 34px; }
  .edu-list { margin-top: 30px; }
  .edu-list li { list-style: none; font-size: 27px; line-height: 1.4; margin-bottom: 22px;
    padding-left: 60px; position: relative; }
  .edu-list li .n { position: absolute; left: 0; top: 2px; font-family: 'CascadiaV', monospace;
    font-weight: 700; color: var(--green); font-size: 24px; }

  /* ---- pie ---- */
  .pie { margin-top: 26px; border-top: 1px solid var(--border); padding-top: 18px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; }
  .pilares { display: flex; gap: 44px; }
  .pilares div { font-family: 'CascadiaV', monospace; font-size: 13px; letter-spacing: 1px;
    color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  .pilares div b { display: block; color: var(--text); font-size: 15px; letter-spacing: 2px; margin-bottom: 4px; }
  .dominio { font-family: 'CascadiaV', monospace; font-size: 22px; color: var(--green);
    letter-spacing: 1px; white-space: nowrap; }
</style>

<div id="stage">
  <div id="fondo"></div>
  <div id="oscurece"></div>
  <div id="grilla"></div>
  <div id="halo"></div>

  <div id="cont">
    <div class="topbar">
      <span>FINANZAS · CRIPTO · CEDEARS · WALL ST</span>
      <span class="fecha" id="fecha">—</span>
    </div>

    <div class="masthead">
      <h1><span class="g">V</span>ERDIKT</h1>
      <div class="tagline">El veredicto de tus inversiones</div>
    </div>

    <div id="cuerpo"></div>

    <div class="pie">
      <div class="pilares">
        <div><b>IA propia</b>modelos reales</div>
        <div><b>Riesgo</b>volatilidad + noticias</div>
        <div><b>Todo el mercado</b>acciones · cedears · cripto</div>
      </div>
      <div class="dominio">app.verdikt.finance</div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
  const D = window.DATA || {};
  const VCOL = { COMPRA: 'var(--buy)', ACUMULAR: 'var(--acc)', NEUTRAL: 'var(--neu)',
                 CAUTELA: 'var(--cau)', EVITAR: 'var(--avo)' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const signo = n => (n > 0 ? '+' : '') + n;

  document.getElementById('fecha').textContent = D.fecha || '';
  document.body.className = D.tipo || 'veredicto';

  const cuerpo = document.getElementById('cuerpo');

  function phone(inner) {
    return `<div class="telewrap"><div class="phone"><div class="notch"></div>
      <div class="screen" id="screen"><div class="noscreen">${inner || 'app.verdikt.finance'}</div></div>
    </div></div>`;
  }

  if (D.tipo === 'termometro') {
    const bull = D.bull_pct || 0, bear = D.bear_pct || 0, flat = Math.max(0, 100 - bull - bear);
    const filas = (D.indices || []).map(i => `
      <div class="row"><span class="k">${esc(i.name)}</span>
        <span><span class="v">${esc(i.value)}</span>
        <span class="d ${i.chg >= 0 ? 'up' : 'down'}">${signo(i.chg)}%</span></span></div>`).join('');
    cuerpo.innerHTML = `<div class="cols"><div class="izq">
      <div class="kicker">${esc(D.kicker || 'TERMÓMETRO DEL MERCADO')}</div>
      <div class="mood-label">Ánimo <span style="color:${VCOL[D.mood_label] || 'var(--dim)'}">${esc(D.mood_label)}</span><br>${esc(D.mood_score)}<span style="font-family:'CascadiaV';font-size:34px;color:var(--faint)">/100</span></div>
      <div class="mood-bar"><div class="bull" style="width:${bull}%"></div><div class="flat" style="width:${flat}%"></div><div class="bear" style="width:${bear}%"></div></div>
      <div class="mood-legend"><span>${bull}% alcistas</span><span>${bear}% bajistas</span></div>
      <div class="stats">${filas}
        <div class="row"><span class="k">Dólar CCL</span><span class="v">${esc(D.ccl)}</span></div>
      </div>
      <div class="titular">${esc(D.nota)}</div>
    </div>${phone()}</div>`;
  } else if (D.tipo === 'cambios') {
    const filas = (D.items || []).map(it => `
      <div class="ch"><span class="sym">${esc(it.symbol)}</span>
        <span class="flow"><span style="color:${VCOL[it.prev] || 'var(--dim)'}">${esc(it.prev)}</span>
          <span class="arr">→</span><span style="color:${VCOL[it.now] || 'var(--dim)'}">${esc(it.now)}</span></span>
        <span class="sc">${esc(it.prev_score)} → ${esc(it.score)}</span></div>`).join('');
    cuerpo.innerHTML = `<div class="cols"><div class="izq">
      <div class="kicker">${esc(D.kicker || 'CAMBIÓ DE OPINIÓN')}</div>
      <div class="activo">${esc(D.title || 'El mercado cambió de opinión')}</div>
      <div class="ticker">${esc(D.subtitle || '')}</div>
      <div class="changes">${filas}</div>
      <div class="titular">${esc(D.nota)}</div>
    </div>${phone()}</div>`;
  } else if (D.tipo === 'educativa') {
    const body = D.items && D.items.length
      ? `<ol class="edu-list">${D.items.map((t, i) => `<li><span class="n">${i + 1}</span>${esc(t)}</li>`).join('')}</ol>`
      : `<div class="edu-body">${esc(D.body)}</div>`;
    cuerpo.innerHTML = `<div class="edu">
      <div class="kicker">${esc(D.kicker || 'APRENDÉ A LEERLO')}</div>
      <div class="edu-q">${D.q_html || esc(D.q)}</div>
      ${body}
    </div>`;
  } else {
    // veredicto
    cuerpo.innerHTML = `<div class="cols"><div class="izq">
      <div class="kicker">${esc(D.kicker || 'VEREDICTO DEL DÍA')}</div>
      <div class="activo">${esc(D.name)}</div>
      <div class="ticker">${esc(D.symbol)} · ${esc(D.mercado)}</div>
      <div class="veredicto-row">
        <div class="score">${esc(D.score)}<small>/100</small></div>
        <div class="pill" style="color:${VCOL[D.verdict] || 'var(--dim)'}">${esc(D.verdict)}</div>
      </div>
      <div class="titular">${D.titular ? '“' + esc(D.titular) + '”' : ''}</div>
      <div class="porque">
        <div><h3>A favor</h3><ul class="fav">${(D.afavor || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        <div><h3>En contra</h3><ul class="con">${(D.encontra || []).length
          ? (D.encontra).map(t => `<li>${esc(t)}</li>`).join('')
          : '<li style="color:var(--faint)">sin señales en contra</li>'}</ul></div>
      </div>
    </div>${phone()}</div>`;
  }

  // ---- carga de imágenes (fondo + captura) ----
  window.__placaReady = false;
  const necesitaScreen = D.tipo !== 'educativa';
  let pendientes = 1 + (necesitaScreen ? 1 : 0);
  const listo = () => { if (--pendientes <= 0) window.__placaReady = true; };

  if (necesitaScreen) {
    const img = new Image();
    img.onload = () => {
      const s = document.getElementById('screen');
      if (s) { s.innerHTML = ''; s.appendChild(img); }
      listo();
    };
    img.onerror = listo;
    img.src = 'screen.png?' + Date.now();
  }

  const FONDOS = (D.fondos && D.fondos.length) ? D.fondos : ['fondo-1.png'];
  const idx = (new Date().getDate()) % FONDOS.length;
  const fondoUrl = `fondos/${FONDOS[idx]}`;
  const pre = new Image();
  pre.onload = pre.onerror = listo;
  pre.src = fondoUrl;
  document.getElementById('fondo').style.backgroundImage = `url('${fondoUrl}')`;
</script>
